<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a1a">
  <title>Middle-earth: Streets of Minas Tirith</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="hud-top">
      <div id="title">Middle-earth: Streets of Minas Tirith</div>
      <div id="stats">
        <span id="gold">Gold: 0</span>
        <span id="renown">Renown: 0</span>
        <span id="wanted"></span>
      </div>
      <button id="pause-btn" type="button" aria-label="Pause">II</button>
      <button id="map-btn" type="button" aria-label="Map">Map</button>
      <button id="save-btn" type="button" aria-label="Save">Save</button>
      <button id="load-btn" type="button" aria-label="Load">Load</button>
    </div>
    <div id="hp-wrap"><div id="hp-bar"></div><div id="hp-text">100 / 100</div></div>
    <div id="mount-indicator"></div>
  </div>

  <div id="touch-overlay">
    <div id="stick-zone">
      <div id="stick-base"><div id="stick-knob"></div></div>
    </div>
    <div id="buttons">
      <button id="talk-btn" type="button" aria-label="Talk" class="hidden">Talk</button>
      <button id="mount-btn" type="button" aria-label="Mount horse">Mount</button>
      <button id="bow-btn" type="button" aria-label="Bow">Bow</button>
      <button id="attack-btn" type="button" aria-label="Attack">Attack</button>
    </div>
  </div>

  <div id="message-overlay" class="hidden">
    <div id="message-box">
      <h1 id="message-title">Middle-earth</h1>
      <p id="message-body">Press Start to ride out.</p>
      <button id="message-btn" type="button">Start</button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <div id="dialogue-overlay" class="hidden">
    <div id="dialogue-box">
      <p id="dialogue-text"></p>
      <div id="dialogue-choices"></div>
    </div>
  </div>

  <!-- Core: constants, math, state, event bus, common actor factory -->
  <script src="js/engine/config.js"></script>
  <script src="js/engine/util.js"></script>
  <script src="js/engine/state.js"></script>
  <script src="js/engine/event_bus.js"></script>
  <script src="js/engine/actor.js"></script>

  <!-- Region geometry -->
  <script src="js/engine/map.js"></script>
  <script src="js/engine/map_minas_tirith.js"></script>
  <script src="js/engine/region.js"></script>
  <script src="js/engine/region_content.js"></script>

  <!-- World content (GENERATED by build.js — populates window.W.*). -->
  <script src="js/world/_manifest.js"></script>
  <script src="js/world/factions.js"></script>
  <script src="js/world/items.js"></script>
  <script src="js/world/classes.js"></script>
  <script src="js/world/tilemaps.js"></script>
  <script src="js/world/regions.js"></script>
  <script src="js/world/settlements.js"></script>
  <script src="js/world/buildings.js"></script>
  <script src="js/world/npcs.js"></script>
  <script src="js/world/dialogues.js"></script>
  <script src="js/world/quests.js"></script>
  <script src="js/world/arcs.js"></script>
  <script src="js/world/encounters.js"></script>
  <script src="js/world/overworld.js"></script>

  <!-- Entity factories and registry. Factories are loaded before the
       per-type files that register draw/update bindings. -->
  <script src="js/engine/entities.js"></script>
  <script src="js/engine/entity_registry.js"></script>

  <!-- Player action + AI + rendering primitives. Referenced by the
       per-type files below. -->
  <script src="js/engine/player.js"></script>
  <script src="js/engine/combat.js"></script>
  <script src="js/engine/ai.js"></script>
  <script src="js/engine/render.js"></script>

  <!-- Per-entity-type modules. Each registers into entityTypes{}. -->
  <script src="js/engine/entity_types/player.js"></script>
  <script src="js/engine/entity_types/orc.js"></script>
  <script src="js/engine/entity_types/guard.js"></script>
  <script src="js/engine/entity_types/horse.js"></script>
  <script src="js/engine/entity_types/pickup.js"></script>
  <script src="js/engine/entity_types/projectile.js"></script>
  <script src="js/engine/entity_types/npc.js"></script>

  <!-- Subsystems (faction, quest, dialogue, overworld, save, HUD). -->
  <script src="js/engine/faction.js"></script>
  <script src="js/engine/quest.js"></script>
  <script src="js/engine/dialogue.js"></script>
  <script src="js/engine/overworld.js"></script>
  <script src="js/engine/save.js"></script>
  <script src="js/engine/hud.js"></script>
  <script src="js/engine/class_picker.js"></script>

  <!-- Input last (after hud for togglePause; after dialogue/overworld
       for the mode-aware key routing). -->
  <script src="js/engine/input.js"></script>
  <script src="js/engine/input_touch.js"></script>

  <!-- Boot. -->
  <script src="js/engine/loop.js"></script>
</body>
</html>
