<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a1a">
  <title>Middle-earth: Streets of Minas Tirith</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="hud-top">
      <div id="title">Middle-earth: Streets of Minas Tirith</div>
      <div id="stats">
        <span id="gold">Gold: 0</span>
        <span id="renown">Renown: 0</span>
        <span id="wanted"></span>
      </div>
      <button id="pause-btn" type="button" aria-label="Pause">II</button>
    </div>
    <div id="hp-wrap"><div id="hp-bar"></div><div id="hp-text">100 / 100</div></div>
    <div id="mount-indicator"></div>
  </div>

  <div id="touch-overlay">
    <div id="stick-zone">
      <div id="stick-base"><div id="stick-knob"></div></div>
    </div>
    <div id="buttons">
      <button id="interact-btn" type="button" aria-label="Interact">Use</button>
      <button id="mount-btn" type="button" aria-label="Mount horse">Mount</button>
      <button id="attack-btn" type="button" aria-label="Attack">Attack</button>
    </div>
  </div>

  <div id="message-overlay" class="hidden">
    <div id="message-box">
      <h1 id="message-title">Middle-earth</h1>
      <p id="message-body">Press Start to ride out.</p>
      <button id="message-btn" type="button">Start</button>
    </div>
  </div>

  <!-- Foundations -->
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/events.js"></script>
  <script src="js/save.js"></script>
  <script src="js/state.js"></script>

  <!-- Items -->
  <script src="js/items/defs.js"></script>
  <script src="js/items/inventory.js"></script>

  <!-- Factions -->
  <script src="js/factions/model.js"></script>
  <script src="js/factions/hostility.js"></script>

  <!-- World foundations (must precede map.js so generateWorld exists) -->
  <script src="js/world/landmarks.js"></script>
  <script src="js/world/middleEarth.js"></script>

  <!-- Core engine (map.js calls generateWorld) -->
  <script src="js/map.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/player.js"></script>

  <!-- Combat -->
  <script src="js/combat/projectile.js"></script>
  <script src="js/combat/weaponFx.js"></script>

  <!-- World layers -->
  <script src="js/world/tiers.js"></script>
  <script src="js/world/doors.js"></script>
  <script src="js/world/props.js"></script>
  <script src="js/world/beacons.js"></script>
  <script src="js/world/rohirrim.js"></script>
  <script src="js/world/gates.js"></script>

  <!-- Enemies -->
  <script src="js/ai/enemies.js"></script>
  <script src="js/ai/spiders.js"></script>
  <script src="js/ai/haradrim.js"></script>
  <script src="js/ai/wildlife.js"></script>
  <script src="js/ai/spawnTable.js"></script>

  <!-- Bosses -->
  <script src="js/bosses/troll.js"></script>
  <script src="js/bosses/urukCaptain.js"></script>
  <script src="js/bosses/witchKing.js"></script>
  <script src="js/bosses/balrog.js"></script>
  <script src="js/bosses/sauron.js"></script>
  <script src="js/bosses/index.js"></script>

  <!-- Loot (fires on enemy death) -->
  <script src="js/items/loot.js"></script>

  <!-- Companions -->
  <script src="js/companions/follow.js"></script>
  <script src="js/companions/legolas.js"></script>
  <script src="js/companions/gimli.js"></script>
  <script src="js/companions/gandalf.js"></script>
  <script src="js/companions/recruit.js"></script>
  <script src="js/companions/tags.js"></script>

  <!-- Mounts -->
  <script src="js/mounts/eagle.js"></script>
  <script src="js/mounts/warg.js"></script>
  <script src="js/mounts/mumak.js"></script>
  <script src="js/mounts/shadowfax.js"></script>
  <script src="js/mounts/ent.js"></script>
  <script src="js/mounts/fellBeast.js"></script>
  <script src="js/mounts/base.js"></script>

  <!-- Quests -->
  <script src="js/quests/engine.js"></script>
  <script src="js/quests/giver.js"></script>
  <script src="js/quests/waypoint.js"></script>
  <script src="js/quests/defs/faramir.js"></script>
  <script src="js/quests/defs/pelennor.js"></script>
  <script src="js/quests/defs/captainHorse.js"></script>

  <!-- Faction rules -->
  <script src="js/factions/rules.js"></script>

  <!-- Meta (persistence, classes, levelling) -->
  <script src="js/meta/profile.js"></script>
  <script src="js/meta/classes.js"></script>
  <script src="js/meta/leveling.js"></script>
  <script src="js/meta/victory.js"></script>
  <script src="js/meta/hall.js"></script>

  <!-- Time-of-day + events -->
  <script src="js/time/cycle.js"></script>
  <script src="js/time/tint.js"></script>
  <script src="js/time/nazgul.js"></script>
  <script src="js/time/ambush.js"></script>

  <!-- World watchdogs + region respawn (after enemy factories) -->
  <script src="js/world/rescue.js"></script>
  <script src="js/world/respawn.js"></script>
  <script src="js/world/regionEnemies.js"></script>
  <script src="js/world/moria.js"></script>
  <script src="js/world/spawn.js"></script>

  <!-- HUD + input + boot -->
  <script src="js/input.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/hud_extras.js"></script>
  <script src="js/hud_marker.js"></script>
  <script src="js/hud_minimap.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
