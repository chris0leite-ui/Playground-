<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a1a">
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Middle-earth</title>
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="hud-top">
      <div id="title">Middle-earth</div>
      <div id="stats">
        <span id="gold">Gold: 0</span>
        <span id="renown">Renown: 0</span>
        <span id="wanted"></span>
      </div>
      <button id="pause-btn" type="button" aria-label="Pause">II</button>
      <button id="save-btn" type="button" aria-label="Save">Save</button>
      <button id="load-btn" type="button" aria-label="Load">Load</button>
    </div>
    <div id="hp-wrap"><div id="hp-bar"></div><div id="hp-text">100 / 100</div></div>
    <div id="mount-indicator"></div>
    <div id="quest-log" class="hidden"></div>
  </div>

  <div id="touch-overlay">
    <div id="stick-zone">
      <div id="stick-base"><div id="stick-knob"></div></div>
    </div>
    <div id="buttons">
      <button id="talk-btn" type="button" aria-label="Talk" class="hidden">Talk</button>
      <button id="mount-btn" type="button" aria-label="Mount horse">Mount</button>
      <button id="bow-btn" type="button" aria-label="Bow">Bow</button>
      <button id="attack-btn" type="button" aria-label="Attack">Attack</button>
    </div>
  </div>

  <div id="message-overlay" class="hidden">
    <div id="message-box">
      <h1 id="message-title">Middle-earth</h1>
      <p id="message-body">Press Start to ride out.</p>
      <button id="message-btn" type="button">Start</button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <div id="dialogue-overlay" class="hidden">
    <div id="dialogue-box">
      <p id="dialogue-text"></p>
      <div id="dialogue-choices"></div>
    </div>
  </div>

  <!-- Core -->
  <script src="js/engine/config.js?v=12"></script>
  <script src="js/engine/util.js?v=12"></script>
  <script src="js/engine/state.js?v=12"></script>
  <script src="js/engine/event_bus.js?v=12"></script>
  <script src="js/engine/actor.js?v=12"></script>

  <!-- Unified world: tiles, worldgen, shim. -->
  <script src="js/engine/map.js?v=12"></script>
  <script src="js/engine/map_tiles.js?v=12"></script>
  <script src="js/engine/map_tiles_ext.js?v=12"></script>
  <script src="js/engine/world.js?v=12"></script>
  <script src="js/world/worldgen_biomes.js?v=12"></script>
  <script src="js/world/worldgen_terrain.js?v=12"></script>
  <script src="js/world/worldgen_city.js?v=12"></script>
  <script src="js/world/worldgen_landmarks.js?v=12"></script>
  <script src="js/world/worldgen.js?v=12"></script>

  <!-- Content shards (GENERATED by build.js). -->
  <script src="js/world/_manifest.js?v=12"></script>
  <script src="js/world/factions.js?v=12"></script>
  <script src="js/world/items.js?v=12"></script>
  <script src="js/world/regions.js?v=12"></script>
  <script src="js/world/settlements.js?v=12"></script>
  <script src="js/world/buildings.js?v=12"></script>
  <script src="js/world/npcs.js?v=12"></script>
  <script src="js/world/dialogues.js?v=12"></script>
  <script src="js/world/quests.js?v=12"></script>
  <script src="js/world/arcs.js?v=12"></script>
  <script src="js/world/encounters.js?v=12"></script>
  <script src="js/world/overworld.js?v=12"></script>

  <!-- Entity factories + registry. -->
  <script src="js/engine/entities.js?v=12"></script>
  <script src="js/engine/entity_registry.js?v=12"></script>

  <!-- Action + AI + rendering. -->
  <script src="js/engine/player.js?v=12"></script>
  <script src="js/engine/combat.js?v=12"></script>
  <script src="js/engine/ai.js?v=12"></script>
  <script src="js/engine/render.js?v=12"></script>

  <!-- Per-entity-type modules. -->
  <script src="js/engine/entity_types/player.js?v=12"></script>
  <script src="js/engine/entity_types/orc.js?v=12"></script>
  <script src="js/engine/entity_types/guard.js?v=12"></script>
  <script src="js/engine/entity_types/horse.js?v=12"></script>
  <script src="js/engine/entity_types/pickup.js?v=12"></script>
  <script src="js/engine/entity_types/projectile.js?v=12"></script>
  <script src="js/engine/entity_types/npc.js?v=12"></script>

  <!-- World population + subsystems. -->
  <script src="js/world/content_spawn.js?v=12"></script>
  <script src="js/world/enemy_scatter.js?v=12"></script>
  <script src="js/engine/faction.js?v=12"></script>
  <script src="js/engine/quest.js?v=12"></script>
  <script src="js/engine/encounter.js?v=12"></script>
  <script src="js/engine/dialogue.js?v=12"></script>
  <script src="js/engine/save.js?v=12"></script>
  <script src="js/engine/hud.js?v=12"></script>
  <script src="js/engine/hud_modals.js?v=12"></script>
  <script src="js/engine/hud_compass.js?v=12"></script>
  <script src="js/engine/hud_minimap.js?v=12"></script>
  <script src="js/engine/hud_minimap_draw.js?v=12"></script>

  <!-- Input last. -->
  <script src="js/engine/input.js?v=12"></script>
  <script src="js/engine/input_touch.js?v=12"></script>

  <!-- Boot. -->
  <script src="js/engine/loop.js?v=12"></script>
</body>
</html>
